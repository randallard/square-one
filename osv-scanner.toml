# OSV scanner config. Read by `osv-scanner` in CI (the osv-scan job in
# .github/workflows/ci.yml, which fails on *any* vulnerability — severity is not a
# threshold there, unlike `pnpm audit --audit-level=high`).
#
# This file exists because pnpm-workspace.yaml's `auditConfig.ignoreGhsas` governs
# `pnpm audit` and nothing else. Two scanners, two config formats, one posture — keep
# the reasoning here and there in sync.
#
# **One ignore, since 2026-10-30** (below; the same, with the same reason, is in
# pnpm-workspace.yaml's auditConfig.ignoreGhsas). From 2026-09-12 until then every
# advisory this repo carried was cleared by a bounded version override in
# pnpm-workspace.yaml rather than waved through here. The ignore that used to live in
# this file — GHSA-mh99-v99m-4gvg, brace-expansion — was justified by there being no
# patched version compatible with minimatch@3's API. The 1.1.18 backport made that
# false, so the override reaches everywhere and the ignore reached nothing. The file
# stays so the knowledge above survives, and so the next ignore has a documented home
# instead of being invented under pressure.
#
# If you add one: say what it is, why no override works, whether it can reach the
# shipped `dist/`, and what would make it removable. An ignore whose reason is not
# checkable is a control that is not a control.
#
# Verify locally — this matches CI line for line:
#   docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.3.8 -r ./

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
# 2026-10-30, medium: minimatch denial of service via globparts amplification, fixed only in
# 11.0.1 with no 3.x or 10.x backport. Via eslint/typescript-eslint (3.x) and license-checker
# → @npmcli (10.x): dev tooling only, never in `dist/`, and only our own patterns. Forcing 3.x
# to 11 breaks eslint. Retire when eslint and typescript-eslint depend on minimatch >= 11.0.1,
# or a backport lands (then override instead).
reason = "Dev tooling only, never in dist/, patterns are ours; no fix within minimatch 3.x/10.x (eslint needs 3.x). Retire when eslint and typescript-eslint use minimatch >= 11.0.1 or a backport lands."
