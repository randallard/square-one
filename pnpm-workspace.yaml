# pnpm 11 reads pnpm settings from here; `.npmrc` is auth/registry only.
# Policy lives in .claude/skills/project-conventions/SKILL.md; this is the enforcement.

# Age-gate new releases at the package manager, so it covers a manual `pnpm add`
# and not just the update bot. 1440 minutes (1 day) is pnpm's own documented
# recommendation and its v11 default: "in most cases, malicious releases are
# discovered and removed from the registry within an hour."
#
# Stated explicitly rather than inherited, so a future default change cannot move
# it silently — and so the value is visible to anyone reading the repo.
minimumReleaseAge: 1440

# ADR-1016: the rest of the supply-chain posture, explicit for the same reason.
# Refuse a release whose provenance or trusted-publisher evidence is weaker than an earlier one's.
trustPolicy: no-downgrade
# One reviewed exception, pinned to the exact version so a later 6.x release is still checked.
# hosted-git-info 6.1.3 is npm's own backport on the 6.x line, published 2024-11-21 by an npm CLI
# maintainer by hand, the day after 8.0.1 went out from npm-cli-ops with SLSA provenance, so it
# reads as a downgrade. (the-lot excepts semver@6.3.1 for the same shape.) It arrives via
# license-checker-rseidelsohn → normalize-package-data@5, the CI licence check, dev-path only.
# Retire this when that chain moves off hosted-git-info@6.
trustPolicyExclude:
  - hosted-git-info@6.1.3
# A transitive dependency may not come from git or a tarball URL, only the registry.
blockExoticSubdeps: true
# The build allowlist: no dependency runs an install script. Add one only after reading it.
allowBuilds: {}

overrides:
  # Every entry here is a **bounded** range, and the bound is load-bearing.
  #
  # `">=1.1.18"` on its own does not mean "the 1.x line, patched" — semver compares across
  # majors, so pnpm happily satisfies it with 5.0.9 and every 1.x consumer gets the 5.x export
  # shape. brace-expansion 1.x exports the function itself and 5.x does not, so that resolution
  # takes `pnpm lint` down with `TypeError: expand is not a function` the moment a config
  # pattern contains braces. townage measured this twice — 2026-07-29 with a blanket override
  # and 2026-08-15 with an unbounded one. Always pin the upper bound.
  #
  # All of these are dev-path only (eslint / typescript-eslint / vitest); this package ships
  # `dist/` and none of them reaches a consumer.

  # GHSA-rgw5-rvv9-x895 — brace-expansion DoS via unbounded intermediate arrays, explicitly a
  # bypass of the CVE-2026-14257 mitigation. **Patched per line**, which is the fact this
  # repo's previous stance was built on the absence of: 1.1.18 for the 1.x consumers reached
  # through minimatch@3, 2.1.4 for 2.x, 5.0.9 for the rest.
  #
  # 🔴 **This is why `GHSA-mh99-v99m-4gvg` is no longer ignored below.** That ignore's stated
  # reason was *"no patched version is compatible with minimatch@3's API"*, which was true when
  # it was written and stopped being true when the 1.x backport landed. A patched 1.x means the
  # override reaches everywhere and the ignore reaches nothing. townage removed the same ignore
  # for the same reason on 2026-08-15; this repo kept it for another month because nothing fails
  # when an ignore nobody needs is still there — osv-scanner just reports it as filtering
  # vulnerabilities that an override would have fixed outright.
  #
  # Raised 2026-10-19 for three more per-line advisories, the latest fix on each line winning:
  # GHSA-6j4f-fj2g-mc7p (parseCommaParts recursion; 1.1.19 / 2.1.5 / 5.0.10), GHSA-qhr7-859c-m2p7
  # (nested-group recursion; 1.1.20 / 2.1.6 / 5.0.11), GHSA-q2hr-2g5m-vwhr (quadratic `{a},b}`
  # rewrite; 1.1.21 / 2.1.7 / 5.0.12).
  "brace-expansion@1": ">=1.1.21 <2"
  "brace-expansion@2": ">=2.1.7 <3"
  "brace-expansion@5": ">=5.0.12 <6"

  # js-yaml, via eslint's `@eslint/eslintrc`. **Two advisories:** GHSA-5p4m-2wfm-xmqj
  # (quadratic CPU in `!!omap` resolution) is fixed in 4.3.1, and GHSA-2883-xcg3-v3hh
  # (`maxTotalMergeKeys` does not limit CPU use for merge keys) in 4.3.2. Satisfy the later one.
  "js-yaml@4": ">=4.3.2 <5"

  # GHSA-2v37-7h3g-55p8 — nanoid can loop indefinitely with a custom generator. Dev-path only.
  "nanoid@3": ">=3.3.18 <4"

  # GHSA-68fv-2mgg-jv7q — source-map-js event-loop DoS via indexed source-map section offsets.
  # Reached through vitest → vite → postcss. Dev-path only.
  "source-map-js@1": ">=1.2.2 <2"
  # 2026-10-30, published 23:09 UTC, fixed only in a new major. glob 13 comes via
  # license-checker-rseidelsohn 5 → @npmcli (it was glob 10 via 4.4.2's read-package-json,
  # until license-checker moved to 5.0.1, the-lot's version); 14 brings minimatch 11 (fixed).
  "glob@13": ">=14.0.2 <15" # GHSA-3g3m-2fjr-6pw4

auditConfig:
  # Governs `pnpm audit` only. CI also runs osv-scanner, which reads its own ignores from
  # osv-scanner.toml — the same posture in a second format. Change one, change the other.
  #
  # Empty from 2026-09-12 (the brace-expansion ignore retired by a backport) until:
  #
  # GHSA-g3hv-75wg-m249 (2026-10-30, medium): minimatch denial of service via globparts
  # amplification. Fixed only in minimatch 11.0.1, with no 3.x or 10.x backport. minimatch 3
  # comes via eslint and typescript-eslint, 10 via license-checker → @npmcli. All dev tooling:
  # this package ships `dist/` and none of it reaches a consumer, and every pattern matched is
  # ours. Forcing 3.x to 11 breaks eslint (the export changed). Retire when eslint and
  # typescript-eslint depend on minimatch >= 11.0.1, or a 3.x/10.x backport lands (then a
  # version override, as brace-expansion's was).
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
